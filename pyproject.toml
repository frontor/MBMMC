[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbmmc"
version = "1.0.0"
description = "Noncommercial research code for RF, crossNN, and MPCNet methylation-based tumor classification."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Guangjian Liu"}
]
keywords = [
  "DNA methylation",
  "tumor classification",
  "random forest",
  "neural network",
  "bioinformatics"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "PyYAML>=6.0",
  "joblib>=1.2",
  "matplotlib>=3.5",
  "numpy>=1.22",
  "pandas>=1.5",
  "scikit-learn>=1.1",
  "torch>=1.13"
]

[project.scripts]
mbmmc-train-rf = "mbmmc.train_rf:main"
mbmmc-train-crossnn = "mbmmc.train_crossnn:main"
mbmmc-train-mpcnet = "mbmmc.train_mpcnet:main"
mbmmc-run-grid = "tools.run_grid:main"
mbmmc-generate-simulation = "scripts.simulation.generate_cross_platform_in_silico_beta:main"
mbmmc-check-release = "tools.check_release:main"

[tool.setuptools]
packages = ["mbmmc", "mbmmc.utils", "tools", "scripts", "scripts.simulation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
